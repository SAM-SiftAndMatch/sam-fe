name: sam-fe-dev

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-false}
    container_name: sam-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
